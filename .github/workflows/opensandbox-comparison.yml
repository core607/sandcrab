name: OpenSandbox same-host comparison

on:
  pull_request:
    paths:
      - 'benchmarks/density/opensandbox/**'
      - 'benchmarks/density/workload.py'
      - '.github/workflows/opensandbox-comparison.yml'
  workflow_dispatch:
    inputs:
      checkpoint:
        description: Full measurement checkpoint
        type: choice
        options: [L2, L7, L9]
        required: true

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build the native release and identical guest tools
        run: |
          docker build --target release --output type=local,dest=build/bin .
          recipe=benchmarks/density/opensandbox/Dockerfile
          docker build -f "$recipe" --target workload -t sandcrab-measure-workload:1 .
          docker build -f "$recipe" --target client -t sandcrab-density-client:ci .
          docker build -f "$recipe" --target machine -t sandcrab-density-machine:ci .
          execd=opensandbox/execd@sha256:6b12d17844ac7167271488302c71934e47f76abb9ddab19ec8529bd1c1c56b23
          docker pull "$execd"
          docker tag "$execd" sandcrab-measure-execd:1.2.1
          docker save -o "$RUNNER_TEMP/upstream-images.tar" sandcrab-measure-workload:1 sandcrab-measure-execd:1.2.1
      - name: Measure both providers
        env:
          CHECKPOINT: ${{ inputs.checkpoint }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mode=(--smoke)
          if [ -n "$CHECKPOINT" ]; then mode=(--checkpoint "$CHECKPOINT"); fi
          python3 benchmarks/density/opensandbox/compare.py "${mode[@]}" \
            --machine sandcrab-density-machine:ci --client sandcrab-density-client:ci \
            --bundle build/bin/sandcrab-linux-x86_64.zip --images "$RUNNER_TEMP/upstream-images.tar" \
            --output "$RUNNER_TEMP/opensandbox-comparison"
      - name: Preserve the summary and raw attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: same-host-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/opensandbox-comparison/
          if-no-files-found: warn
          retention-days: 30
