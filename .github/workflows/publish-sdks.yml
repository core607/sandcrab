name: SDK packages

on:
  pull_request:
    paths: ['sdk/**', 'evals/sdk/native_quickstart.py', '.github/workflows/publish-sdks.yml']
  workflow_dispatch:
    inputs:
      registry:
        description: Publish the version in the SDK manifest to this registry
        type: choice
        options: [pypi, npm]
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build and check the distributions
        run: |
          python -m pip install build twine
          python -m build --outdir dist/pypi sdk/python
          python -m twine check --strict dist/pypi/*
          mkdir -p dist/npm
          npm pack ./sdk/typescript --pack-destination dist/npm
      - name: Install the current public service on the disposable runner
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        run: |
          gh release download --repo core607/sandcrab --pattern sandcrab-linux-x86_64.zip --pattern SHA256SUMS
          awk '$2 == "sandcrab-linux-x86_64.zip"' SHA256SUMS | sha256sum --check
          sudo /usr/bin/python3 -I sandcrab-linux-x86_64.zip
          sudo install -d -m 0711 /etc/sandcrab-client
          sudo /var/lib/sandcrab-release/sandcrab client-token --user "$(id -un)" --output /etc/sandcrab-client/token
      - name: Run both README examples from the built packages
        run: |
          python evals/sdk/native_quickstart.py sdk/python/README.md --package dist/pypi/*.whl
          python evals/sdk/native_quickstart.py sdk/typescript/README.md --package dist/npm/*.tgz
          sudo /var/lib/sandcrab-release/sandcrab session list --socket /var/lib/sandcrab/runtime/control.sock | jq -e '.ids == []'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-packages
          path: dist/
          if-no-files-found: error

  pypi:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.registry == 'pypi'
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/pypi/

  npm:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.registry == 'npm'
    needs: build
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-packages
          path: dist
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm publish dist/npm/*.tgz --registry=https://registry.npmjs.org --access public --provenance
