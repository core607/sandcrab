name: Release and SDK packages

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['sdk/**', 'evals/sdk/native_quickstart.py', 'evals/sdk/workspace_*', 'crates/sandcrab/workspace-tools.json', 'scripts/release_*.py', 'scripts/test_release_*.py', '.github/workflows/publish-sdks.yml', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Optional stable tag to validate against the checked-out release manifests
        type: string
      resume_run:
        description: Original tag workflow run whose published service still needs SDK publication
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'pull_request' && inputs.resume_run == ''
    uses: ./.github/workflows/ci.yml
  conformance:
    if: github.event_name != 'pull_request' && inputs.resume_run == ''
    uses: ./.github/workflows/evals.yml
  readiness:
    if: github.event_name != 'pull_request' && inputs.resume_run == ''
    uses: ./.github/workflows/sandcrab-readiness.yml
    with:
      retain_image: true
  build:
    needs: readiness
    if: ${{ !cancelled() && inputs.resume_run == '' && (github.event_name == 'pull_request' || needs.readiness.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build and check the distributions
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct)"
          python -m unittest discover -s scripts -p 'test_release_*.py'
          python -m pip install build twine
          build_packages() {
            local source="$1" output="$2"
            python -m build --outdir "$output/pypi" "$source/sdk/python"
            mkdir -p "$output/npm"
            npm pack "$source/sdk/typescript" --pack-destination "$output/npm"
          }
          build_packages "$PWD" "$PWD/dist"
          python -m twine check --strict dist/pypi/*
          replay=$(mktemp -d)
          git archive HEAD | tar -x -C "$replay"
          build_packages "$replay" "$replay/dist"
          diff -qr dist "$replay/dist"
      - name: Download the accepted service archive
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.readiness.outputs.release_archive }}
          path: candidate
      - name: Build the PR's candidate service
        if: github.event_name == 'pull_request'
        run: docker build --target release --output type=local,dest=candidate .
      - name: Check release versions
        if: startsWith(github.ref, 'refs/tags/') || inputs.candidate_tag != ''
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag || github.ref_name }}
        run: python scripts/release_packages.py "$CANDIDATE_TAG" dist
      - name: Install the candidate on the disposable runner
        working-directory: candidate
        run: |
          sha256sum -c SHA256SUMS
          sudo /usr/bin/python3 -I sandcrab-linux-x86_64.zip
          sudo install -d -m 0711 /etc/sandcrab-client
          sudo /var/lib/sandcrab-release/sandcrab client-token --user "$(id -un)" --output /etc/sandcrab-client/token
      - name: Run both README examples from the built packages
        run: |
          python evals/sdk/native_quickstart.py sdk/python/README.md --package dist/pypi/*.whl
          python evals/sdk/native_quickstart.py sdk/typescript/README.md --package dist/npm/*.tgz
          sudo /var/lib/sandcrab-release/sandcrab session list --socket /var/lib/sandcrab/runtime/control.sock | jq -e '.ids == []'
      - name: Exercise both packaged workspace clients and bound MCP tools
        run: |
          python evals/sdk/native_quickstart.py sdk/python/README.md --package dist/pypi/*.whl --workspace-tools
          python evals/sdk/native_quickstart.py sdk/typescript/README.md --package dist/npm/*.tgz --workspace-tools
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-packages
          path: dist/
          if-no-files-found: error

  service:
    if: github.event_name == 'push'
    needs: [check, conformance, readiness, build]
    uses: ./.github/workflows/release.yml
    permissions:
      actions: read
      contents: write
      packages: write
    with:
      archive: ${{ needs.readiness.outputs.release_archive }}
      archive_aarch64: ${{ needs.readiness.outputs.release_archive_aarch64 }}
      image: ${{ needs.readiness.outputs.tested_image }}

  recovery:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.resume_run != ''
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      revision: ${{ steps.verify.outputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sdk-packages
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
          path: dist
      - name: Match the original tag build to the published release assets
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.resume_run }}
          CANDIDATE: ${{ inputs.candidate_tag }}
        run: |
          test -z "$CANDIDATE"
          python3 scripts/release_recovery.py "$ORIGINAL_RUN" dist >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sdk-packages
          path: dist/
          if-no-files-found: error

  pypi:
    needs: [service, recovery]
    if: ${{ !cancelled() && (needs.service.result == 'success' || needs.recovery.result == 'success') }}
    runs-on: ubuntu-24.04
    environment: pypi
    env:
      RELEASE_TAG: ${{ needs.recovery.outputs.tag || github.ref_name }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sdk-packages
          path: dist
      - name: Verify existing files and select missing distributions
        id: reconcile
        run: python3 scripts/release_packages.py "$RELEASE_TAG" dist --registry pypi --prepare pending >> "$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        if: steps.reconcile.outputs.pending == 'true'
        with:
          packages-dir: pending/
      - name: Read back the accepted distribution bytes
        run: python3 scripts/release_packages.py "$RELEASE_TAG" dist --registry pypi --verify

  npm:
    needs: [service, recovery]
    if: ${{ !cancelled() && (needs.service.result == 'success' || needs.recovery.result == 'success') }}
    runs-on: ubuntu-24.04
    environment: npm
    env:
      RELEASE_TAG: ${{ needs.recovery.outputs.tag || github.ref_name }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sdk-packages
          path: dist
      - name: Verify existing files and select missing distributions
        id: reconcile
        run: python3 scripts/release_packages.py "$RELEASE_TAG" dist --registry npm --prepare pending >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.reconcile.outputs.pending == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - if: steps.reconcile.outputs.pending == 'true'
        run: npm publish ./pending/*.tgz --registry=https://registry.npmjs.org --access public --provenance
      - name: Read back the accepted distribution bytes
        run: python3 scripts/release_packages.py "$RELEASE_TAG" dist --registry npm --verify

  installed-release:
    needs: [pypi, npm, recovery]
    if: ${{ !cancelled() && needs.pypi.result == 'success' && needs.npm.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.recovery.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.recovery.outputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the published service at the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --pattern sandcrab-linux-x86_64.zip --pattern SHA256SUMS
          awk '$2 == "sandcrab-linux-x86_64.zip"' SHA256SUMS | sha256sum --check
          sudo /usr/bin/python3 -I sandcrab-linux-x86_64.zip
          sudo install -d -m 0711 /etc/sandcrab-client
          sudo /var/lib/sandcrab-release/sandcrab client-token --user "$(id -un)" --output /etc/sandcrab-client/token
      - name: Install both published SDKs in fresh projects
        run: |
          python evals/sdk/native_quickstart.py sdk/python/README.md
          python evals/sdk/native_quickstart.py sdk/typescript/README.md
