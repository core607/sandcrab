name: Sandcrab installer acceptance

on:
  pull_request:
    paths: [Cargo.toml, Cargo.lock, Dockerfile, README.md, 'crates/**', 'examples/**', 'scripts/package.py', 'scripts/third_party_notices.py', 'scripts/test_third_party_notices.py', 'evals/sdk/requirements.txt', 'benchmarks/density/Dockerfile.readiness', '.github/workflows/sandcrab-readiness.yml']
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, Dockerfile, README.md, 'crates/**', 'examples/**', 'scripts/package.py', 'scripts/third_party_notices.py', 'scripts/test_third_party_notices.py', '.github/workflows/sandcrab-readiness.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      retain_image:
        type: boolean
        default: false
    outputs:
      release_archive:
        value: ${{ jobs.build.outputs.release_archive }}
      tested_image:
        value: ${{ jobs.container.outputs.tested_image }}

permissions:
  contents: read

concurrency:
  group: sandcrab-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    outputs:
      release_archive: ${{ steps.fingerprint.outputs.archive_name }}
      bundle_id: ${{ steps.bundle.outputs.artifact-id }}
      bundle_sha256: ${{ steps.fingerprint.outputs.sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: docker build --target release --output type=local,dest=build/bin .
      - name: Check release staging and the documented command budget
        run: |
          python3 -m unittest discover -s scripts -p test_third_party_notices.py -v
          sudo python3 -m unittest discover -s crates/sandcrab/install -p test_quickstart.py -v
      - name: Read the release digest
        id: fingerprint
        run: |
          echo "archive_name=sandcrab-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          (cd build/bin && sha256sum -c SHA256SUMS)
          echo "sha256=$(sha256sum build/bin/sandcrab-linux-x86_64.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: bundle
        with:
          path: build/bin/sandcrab-linux-x86_64.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.fingerprint.outputs.archive_name }}
          path: build/bin/
          if-no-files-found: error
          retention-days: 14

  quickstart:
    name: quickstart (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, runner: ubuntu-22.04 }
          - { os: ubuntu-24.04, runner: ubuntu-24.04 }
          - { os: debian-12, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Prepare a fresh Debian systemd guest
        if: matrix.os == 'debian-12'
        run: |
          docker build --target quickstart --build-arg BASE_IMAGE=debian:12@sha256:d74df7598108a173a621eda4d58a2adbf850b2d9a9d81bc2cca1a6c21174a880 \
            -f benchmarks/density/Dockerfile.readiness -t sandcrab-quickstart:debian benchmarks/density
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            sudo apparmor_parser -r crates/sandcrab/install/sandcrab.apparmor
          fi
      - name: Time the README from download to first run and verify the installed binary
        env:
          TARGET_OS: ${{ matrix.os }}
          GITHUB_TOKEN: ${{ github.token }}
          SANDCRAB_ARTIFACT_API: ${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts/${{ needs.build.outputs.bundle_id }}/zip
          SHA256: ${{ needs.build.outputs.bundle_sha256 }}
        run: |
          args=(--sha256 "$SHA256" --output "$RUNNER_TEMP/quickstart")
          if [ "$TARGET_OS" = debian-12 ]; then
            python3 crates/sandcrab/install/quickstart.py "${args[@]}" --distribution sandcrab-quickstart:debian
          else
            sudo --preserve-env=GITHUB_TOKEN,SANDCRAB_ARTIFACT_API env SANDCRAB_INSTALL_DISPOSABLE=1 \
              python3 crates/sandcrab/install/quickstart.py "${args[@]}"
          fi
      - name: Run the curl, build agent and batch examples
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo curl --fail --unix-socket /var/lib/sandcrab/runtime/control.sock http://localhost/v1/info | jq -e '.profiles.default'
          sudo bash examples/sandcrab-build-test.sh
          printf 'print(21 * 2)\n' > "$RUNNER_TEMP/one.py"
          printf 'raise SystemExit(7)\n' > "$RUNNER_TEMP/two.py"
          rc=0
          sudo python3 examples/sandcrab-batch.py "$RUNNER_TEMP/one.py" "$RUNNER_TEMP/two.py" > "$RUNNER_TEMP/batch.jsonl" || rc=$?
          test "$rc" = 1
          jq -es 'length == 2 and .[0].run.result.stdout == "42\n" and .[1].run.result.exitCode == 7' "$RUNNER_TEMP/batch.jsonl"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: matrix.os == 'ubuntu-24.04'
        with:
          distribution: temurin
          java-version: '21'
      - name: Run the published Python and Kotlin SDK examples as an ordinary client
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python3 -m venv "$RUNNER_TEMP/sdk-python"
          "$RUNNER_TEMP/sdk-python/bin/pip" install --disable-pip-version-check -r evals/sdk/requirements.txt
          curl -fsSL -o "$RUNNER_TEMP/kotlin.zip" https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip
          echo "a623871f1cd9c938946948b70ef9170879f0758043885bbd30c32f024e511714  $RUNNER_TEMP/kotlin.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlin"
          export SANDCRAB_TOKEN_FILE="$RUNNER_TEMP/sdk-client-token"
          sudo install -o "$(id -u)" -g "$(id -g)" -m 600 /etc/sandcrab/token "$SANDCRAB_TOKEN_FILE"
          test "$("$RUNNER_TEMP/sdk-python/bin/python" examples/sandcrab-sdk.py)" = 42
          test "$("$RUNNER_TEMP/kotlin/kotlinc/bin/kotlin" examples/sandcrab-sdk.main.kts)" = 42
      - name: Hand quickstart receipts to the collector
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/quickstart" ]; then
            sudo chown --no-dereference -R "$(id -u):$(id -g)" "$RUNNER_TEMP/quickstart"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: quickstart-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quickstart/
          if-no-files-found: warn
          retention-days: 30

  debian:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.release_archive }}
          path: build/bin
      - name: Exercise install and doctor on fresh Debian 12
        run: |
          docker build --build-arg BASE_IMAGE=debian:12@sha256:d74df7598108a173a621eda4d58a2adbf850b2d9a9d81bc2cca1a6c21174a880 \
            -t sandcrab-install:debian -f benchmarks/density/Dockerfile.readiness benchmarks/density
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            sudo apparmor_parser -r crates/sandcrab/install/sandcrab.apparmor
          fi
          python3 crates/sandcrab/install/probe.py --distribution sandcrab-install:debian \
            --bundle build/bin --report "$RUNNER_TEMP/readiness-debian12.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: readiness-debian12-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/readiness-debian12.json
          if-no-files-found: warn
          retention-days: 30

  native:
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.release_archive }}
          path: build/bin
      - name: Exercise install and doctor on the fresh host
        run: |
          stat -c '%n %U:%G %a' /var/lib /usr/local/bin /etc/systemd/system
          sudo env SANDCRAB_INSTALL_DISPOSABLE=1 python3 crates/sandcrab/install/probe.py \
            --bundle build/bin --report "$RUNNER_TEMP/readiness-native.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: readiness-native-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/readiness-native.json
          if-no-files-found: warn
          retention-days: 30

  container:
    outputs:
      tested_image: ${{ steps.save_image.outputs.artifact }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.release_archive }}
          path: build/bin
      - name: Run the packaged daemon with a bounded private cgroup
        run: |
          docker build -f crates/sandcrab/install/Dockerfile -t "sandcrab-ci:$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" build/bin
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            sudo apparmor_parser -r crates/sandcrab/install/sandcrab.apparmor
          fi
          python3 crates/sandcrab/install/probe.py --image "sandcrab-ci:$GITHUB_SHA" --report "$RUNNER_TEMP/install-image.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sandcrab-container-check
          path: ${{ runner.temp }}/install-image.json
          if-no-files-found: warn
      - name: Save the tested image for publication
        id: save_image
        if: inputs.retain_image
        shell: bash
        run: |
          echo "artifact=sandcrab-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          docker save "sandcrab-ci:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/sandcrab-image.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.retain_image
        with:
          name: ${{ steps.save_image.outputs.artifact }}
          path: ${{ runner.temp }}/sandcrab-image.tar.gz
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
