name: Service class comparison

on:
  workflow_dispatch:
  pull_request:
    paths:
      - benchmarks/density/service_classes.py
      - benchmarks/density/test_service_classes.py
      - .github/workflows/service-classes.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build the measured binary with its checksum-matched published helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.1 --repo "$GITHUB_REPOSITORY" --pattern bwrap --dir build/classes
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          helper = Path('build/classes/bwrap').read_bytes()
          lock = json.loads(Path('crates/sandcrab-launch/bwrap/lock.json').read_text())
          assert hashlib.sha256(helper).hexdigest() == lock['binarySha256'] and len(helper) == lock['binaryBytes']
          PY
          docker build --target binary --tag "service-classes:$GITHUB_RUN_ID" .
          container=$(docker create "service-classes:$GITHUB_RUN_ID" true)
          docker cp "$container:/source/target/x86_64-unknown-linux-musl/release/sandcrab" build/classes/sandcrab
          docker rm "$container"
          chmod 755 build/classes/bwrap build/classes/sandcrab
      - name: Prepare and verify the disposable native host
        run: |
          command -v mkfs.xfs || { sudo apt-get update && sudo apt-get install --yes --no-install-recommends xfsprogs; }
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo install -d -m 755 /var/lib/sandcrab-classes
          sudo bash scripts/prepare-tools.sh /var/lib/sandcrab-classes/tools
          printf '+cpu +memory +pids' | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null
          python3 -m unittest discover -s benchmarks/density -p test_service_classes.py -v
      - name: Compare interactive service with background compilation and startups
        run: |
          sudo env PATH=/var/lib/sandcrab-classes/tools/extracted/usr/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            python3 benchmarks/density/service_classes.py --binary build/classes/sandcrab \
            --tools /var/lib/sandcrab-classes/tools --output /var/lib/sandcrab-classes/results
      - name: Make retained attempts readable to the artifact collector
        if: always()
        run: |
          if [ -d /var/lib/sandcrab-classes/results ]; then
            sudo chown --no-dereference -R "$(id -u):$(id -g)" /var/lib/sandcrab-classes/results
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: service-classes-${{ github.run_id }}-${{ github.run_attempt }}
          path: /var/lib/sandcrab-classes/results/
          if-no-files-found: warn
          retention-days: 14
