name: Repository documents and skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: python3 scripts/sync-claude-skills.py --check
      - run: python3 scripts/repo_check.py
      - run: python3 -m unittest discover -s scripts -p test_repo_check.py -v
