name: Agent evaluations

on:
  workflow_dispatch:
    inputs:
      evidence_mode:
        description: Scripted harness evidence or a metered model trial
        type: choice
        options: [scripted, model]
        default: scripted
      suite:
        description: Native API cases, programming/file tasks, or both
        type: choice
        options: [workspace, all, native]
        default: workspace
      workspace_client:
        description: Programming client (ignored for the native-only suite)
        type: choice
        options: [sdk, native, mcp-pair]
        default: sdk
      model:
        description: Model for the independent Sandcrab tasks
        type: choice
        options: [deepseek-flash, gpt-6-luna]
        default: deepseek-flash
      repeats:
        description: Trials per case
        type: choice
        options: ['3', '1', '5']
        default: '3'
      budget_usd:
        description: Total batch budget in USD, including uncertain-call reservations (maximum 5)
        type: string
        default: '1.00'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate the paid run before starting its evaluator
        if: inputs.evidence_mode == 'model'
        run: python3 evals/check_run.py
  native:
    needs: validate
    if: github.ref == 'refs/heads/main' && (inputs.evidence_mode == 'scripted' || github.run_attempt == 1)
    uses: ./.github/workflows/evals.yml
    with:
      evidence_mode: ${{ inputs.evidence_mode }}
      suite: ${{ inputs.suite }}
      workspace_client: ${{ inputs.suite == 'native' && 'native' || inputs.workspace_client }}
      model: ${{ inputs.model }}
      repeats: ${{ fromJSON(inputs.repeats) }}
      budget_usd: ${{ inputs.budget_usd }}
    secrets:
      model_key: ${{ inputs.evidence_mode == 'model' && inputs.model == 'deepseek-flash' && secrets.DEEPSEEK_EVAL_API_KEY || '' }}
      openai_model_key: ${{ inputs.evidence_mode == 'model' && inputs.model == 'gpt-6-luna' && secrets.OPENAI_EVAL_API_KEY || '' }}
