name: Downstream release check
run-name: Downstream release check ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      consumer:
        description: Approved public consumer repository (owner/name)
        required: true
      branch:
        description: Branch in the approved repository
        required: true
      revision:
        description: Exact 40-character consumer commit
        required: true
      release:
        description: Published Sandcrab version
        required: true
      request_id:
        description: Unique 32-character lowercase hex request identifier
        required: true

permissions: {}

env:
  CONSUMER: ${{ inputs.consumer }}
  BRANCH: ${{ inputs.branch }}
  REVISION: ${{ inputs.revision }}
  RELEASE: ${{ inputs.release }}
  REQUEST_ID: ${{ inputs.request_id }}

jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.fetch.outputs.digest }}
    steps:
      - name: Verify the requested consumer and published archive
        id: fetch
        env:
          ALLOWED: ${{ vars.SANDCRAB_DOWNSTREAM_REPOSITORIES }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CONSUMER" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ && "$REQUEST_ID" =~ ^[0-9a-f]{32}$ ]]
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git check-ref-format "refs/heads/$BRANCH"
          python3 -I -c 'import json, os, sys
          approved = json.loads(os.environ["ALLOWED"] or "[]")
          sys.exit(0 if isinstance(approved, list) and os.environ["CONSUMER"] in approved else "Unapproved downstream repository")'
          test "$(gh release view "$RELEASE" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          mkdir release
          cd release
          gh release download "$RELEASE" -R "$GITHUB_REPOSITORY" -p sandcrab-linux-x86_64.zip -p SHA256SUMS
          awk '$2 == "sandcrab-linux-x86_64.zip"' SHA256SUMS > expected
          test "$(wc -l < expected)" -eq 1
          sha256sum -c --strict expected
          echo "digest=$(sha256sum sandcrab-linux-x86_64.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-input
          path: release/sandcrab-linux-x86_64.zip
          retention-days: 1

  test:
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input
          path: ${{ runner.temp }}/release
      - name: Run the consumer's release checks at its verified head
        env:
          DIGEST: ${{ needs.bundle.outputs.digest }}
        run: |
          set -euo pipefail
          export SANDCRAB_BUNDLE="$RUNNER_TEMP/release/sandcrab-linux-x86_64.zip"
          printf '%s  %s\n' "$DIGEST" "$SANDCRAB_BUNDLE" | sha256sum -c --strict -
          git init -q consumer
          cd consumer
          GIT_TERMINAL_PROMPT=0 git fetch --no-tags --depth=1 "https://github.com/$CONSUMER.git" "refs/heads/$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$REVISION"
          git checkout --quiet --detach "$REVISION"
          entry=.github/ci/sandcrab-release-check.sh
          [[ -f "$entry" && ! -L "$entry" && "$(realpath "$entry")" == "$PWD/$entry" ]]
          export SANDCRAB_EVIDENCE="$RUNNER_TEMP/downstream-results"
          mkdir -m 700 "$SANDCRAB_EVIDENCE"
          bash "$entry"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: downstream-results
          path: ${{ runner.temp }}/downstream-results
          if-no-files-found: ignore
          retention-days: 7

  receipt:
    needs: [bundle, test]
    if: always() && needs.bundle.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Bind the platform verdict to the consumer revision and release
        env:
          DIGEST: ${{ needs.bundle.outputs.digest }}
          RESULT: ${{ needs.test.result }}
        run: |
          jq -n '{request:env.REQUEST_ID, consumer:env.CONSUMER, revision:env.REVISION,
            release:env.RELEASE, bundleSha256:env.DIGEST, result:env.RESULT}' > summary.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: downstream-receipt
          path: summary.json
          retention-days: 7
