name: Publish tested service

on:
  workflow_call:
    inputs:
      archive:
        required: true
        type: string
      archive_aarch64:
        required: true
        type: string
      image:
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.archive }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.archive_aarch64 }}
          path: dist-aarch64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.image }}
          path: image
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sdk-packages
          path: sdk-packages
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested release and its exact image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          python3 -c 'import os, tomllib; assert "v" + tomllib.load(open("crates/sandcrab/Cargo.toml", "rb"))["package"]["version"] == os.environ["GITHUB_REF_NAME"]'
          (cd dist && sha256sum -c SHA256SUMS)
          (cd dist-aarch64 && sha256sum -c SHA256SUMS)
          cp dist-aarch64/sandcrab-linux-aarch64.zip dist/sandcrab-linux-aarch64.zip
          awk '$2 == "sandcrab-linux-aarch64.zip"' dist-aarch64/SHA256SUMS >> dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          package=${GITHUB_REPOSITORY,,}
          owner_kind=$(gh api "repos/$GITHUB_REPOSITORY" --jq .owner.type)
          case "$owner_kind" in User) scope=users ;; Organization) scope=orgs ;; *) exit 1 ;; esac
          package_api="$scope/$GITHUB_REPOSITORY_OWNER/packages/container/${package#*/}"
          if [[ "$private" == true ]]; then
            if visibility=$(gh api "$package_api" --jq .visibility 2>"$RUNNER_TEMP/package-error"); then
              test "$visibility" = private
            else
              grep -q 'HTTP 404' "$RUNNER_TEMP/package-error" || { cat "$RUNNER_TEMP/package-error" >&2; exit 1; }
            fi
          fi
          python3 scripts/release_packages.py "$tag" sdk-packages
          python3 scripts/release_assets.py "$tag" \
            dist/{sandcrab,bwrap,bwrap-notices.txt,bwrap-source.tar.xz,sandcrab-linux-x86_64.zip,sandcrab-linux-aarch64.zip,LICENSE,THREAT-MODEL.md,THIRD-PARTY-NOTICES.txt,rust-library-copyright.html,SHA256SUMS} \
            sdk-packages/pypi/* sdk-packages/npm/*
          docker load --input image/sandcrab-image.tar.gz
          source="sandcrab-ci:$GITHUB_SHA"
          test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$source")" = "$GITHUB_SHA"
          target="ghcr.io/${GITHUB_REPOSITORY,,}:$tag"
          if docker pull "$target" 2>"$RUNNER_TEMP/image-pull-error"; then
            test "$(docker inspect --format '{{.Id}}' "$target")" = "$(docker inspect --format '{{.Id}}' "$source")"
          else
            grep -Eqi 'manifest unknown|name unknown|manifest.*not found' "$RUNNER_TEMP/image-pull-error" || { cat "$RUNNER_TEMP/image-pull-error" >&2; exit 1; }
            docker tag "$source" "$target"
            docker push "$target"
          fi
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$target")"
          case "$digest" in "ghcr.io/${GITHUB_REPOSITORY,,}@sha256:"*) ;; *) exit 1 ;; esac
          docker pull "$digest"
          test "$(docker inspect --format '{{.Id}}' "$digest")" = "$(docker inspect --format '{{.Id}}' "$source")"
          if [[ "$private" == true ]]; then
            python3 scripts/check_private_image.py "$package" "$tag"
          fi
          gh release view "$tag" --json isDraft,body > "$RUNNER_TEMP/release.json"
          if jq -e '.isDraft' "$RUNNER_TEMP/release.json" >/dev/null; then
            jq -r '.body' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/notes.md"
            printf '\nContainer image: `%s`\n' "$digest" >> "$RUNNER_TEMP/notes.md"
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md" --draft=false
          else
            jq -e --arg digest "$digest" '.body | contains($digest)' "$RUNNER_TEMP/release.json" >/dev/null
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'sandcrab-linux-*.zip' --dir "$RUNNER_TEMP/release-readback"
          cmp "dist/sandcrab-linux-x86_64.zip" "$RUNNER_TEMP/release-readback/sandcrab-linux-x86_64.zip"
          cmp "dist/sandcrab-linux-aarch64.zip" "$RUNNER_TEMP/release-readback/sandcrab-linux-aarch64.zip"
