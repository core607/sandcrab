name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml
  conformance:
    uses: ./.github/workflows/evals.yml
  readiness:
    uses: ./.github/workflows/sandcrab-readiness.yml
    with:
      retain_image: true
  publish:
    needs: [check, conformance, readiness]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.readiness.outputs.release_archive }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.readiness.outputs.tested_image }}
          path: image
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested release and its exact image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          python3 -c 'import os, tomllib; assert "v" + tomllib.load(open("crates/sandcrab/Cargo.toml", "rb"))["package"]["version"] == os.environ["GITHUB_REF_NAME"]'
          (cd dist && sha256sum -c SHA256SUMS)
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          package=${GITHUB_REPOSITORY,,}
          owner_kind=$(gh api "repos/$GITHUB_REPOSITORY" --jq .owner.type)
          case "$owner_kind" in User) scope=users ;; Organization) scope=orgs ;; *) exit 1 ;; esac
          package_api="$scope/$GITHUB_REPOSITORY_OWNER/packages/container/${package#*/}"
          if [[ "$private" == true ]]; then
            if visibility=$(gh api "$package_api" --jq .visibility 2>"$RUNNER_TEMP/package-error"); then
              test "$visibility" = private
            else
              grep -q 'HTTP 404' "$RUNNER_TEMP/package-error" || { cat "$RUNNER_TEMP/package-error" >&2; exit 1; }
            fi
          fi
          if gh release view "$tag" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            jq -e '.isDraft' "$RUNNER_TEMP/release.json" >/dev/null
          else
            gh release create "$tag" --verify-tag --draft --title "Sandcrab $tag" --generate-notes
          fi
          gh release upload "$tag" dist/{sandcrab,bwrap,bwrap-notices.txt,bwrap-source.tar.xz,sandcrab-linux-x86_64.zip,LICENSE,THREAT-MODEL.md,THIRD-PARTY-NOTICES.txt,rust-library-copyright.html,SHA256SUMS} --clobber
          docker load --input image/sandcrab-image.tar.gz
          source="sandcrab-ci:$GITHUB_SHA"
          test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$source")" = "$GITHUB_SHA"
          target="ghcr.io/${GITHUB_REPOSITORY,,}:$tag"
          docker tag "$source" "$target"
          docker push "$target"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$target")"
          case "$digest" in "ghcr.io/${GITHUB_REPOSITORY,,}@sha256:"*) ;; *) exit 1 ;; esac
          docker pull "$digest"
          test "$(docker inspect --format '{{.Id}}' "$digest")" = "$(docker inspect --format '{{.Id}}' "$source")"
          if [[ "$private" == true ]]; then
            python3 scripts/check_private_image.py "$package" "$tag"
          fi
          gh release view "$tag" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          printf '\nContainer image: `%s`\n' "$digest" >> "$RUNNER_TEMP/notes.md"
          gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md" --draft=false
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern sandcrab-linux-x86_64.zip --dir "$RUNNER_TEMP/release-readback"
          cmp "dist/sandcrab-linux-x86_64.zip" "$RUNNER_TEMP/release-readback/sandcrab-linux-x86_64.zip"
