[service]
opensandbox = true
runtime_root = "/var/lib/sandcrab/runtime"
socket = "@SOCKET@"
client_uid = @CLIENT_UID@
client_gid = @CLIENT_GID@
cgroup_root = "@CGROUP@"
max_sandboxes = @SANDBOXES@
max_records = 128
result_ttl_millis = 300000
max_output_bytes = 8388608

[tcp]
listen = "127.0.0.1:9011"
token_file = "/etc/sandcrab/token"

[storage]
root = "/var/lib/sandcrab/storage"
pool_bytes = @POOL@
max_volume_bytes = @VOLUME_BYTES@
max_volume_inodes = 4096
max_volumes = @VOLUMES@
max_records = 128

[profiles.default]
@OFFLINE_PROFILE@network = "none"

[profiles.packages]
@PACKAGE_PROFILE@network = { allow = ["pypi.org", "files.pythonhosted.org", "registry.npmjs.org"] }
