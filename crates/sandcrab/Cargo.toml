[package]
name = "sandcrab"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
memchr = "2.8"
base64.workspace = true
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
subtle = "2.6.1"
sandcrab-core = { path = "../sandcrab-core" }
sandcrab-launch = { path = "../sandcrab-launch" }
sandcrab-shell = { path = "../sandcrab-shell" }
rustix = { workspace = true, features = ["net", "process", "param", "mount"] }
nix = { version = "0.32", default-features = false, features = ["socket"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
signal-hook = "=0.4.5"
toml = { version = "=0.9.8", default-features = false, features = ["parse", "serde"] }
sha2 = "0.10"
tar = { version = "=0.4.46", default-features = false }
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
regex = "=1.13.1"
domain = { version = "=0.12.3", default-features = false, features = ["std"] }
