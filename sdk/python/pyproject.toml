[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "sandcrab"
dynamic = ["version"]
description = "Native Python client, template workflows, host-call dispatcher and stdio MCP server for Sandcrab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1,<1"]
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/core607/sandcrab"
Documentation = "https://github.com/core607/sandcrab/tree/main/sdk/python"

[project.scripts]
sandcrab-mcp = "sandcrab.mcp:main"

[tool.hatch.version]
path = "src/sandcrab/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sandcrab", "src/sandcrab_templates"]

[tool.hatch.build.targets.sdist]
only-include = ["src/sandcrab", "src/sandcrab_templates", "tests"]
