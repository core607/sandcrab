[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sandcrab-templates"
version = "0.1.0"
description = "Immutable Sandcrab environments for native and OpenSandbox clients"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1,<1"]
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
